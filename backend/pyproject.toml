[project]
name = "lichess-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "dotenv>=0.9.9",
    "iprogress>=0.4",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.9",
    "pandas>=2.3.3",
    "streamlit>=1.50.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
# Ensure uv knows which optional dependency groups to install by default
default-groups = ["dev"]
